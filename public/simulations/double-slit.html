<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #fff; font-family: 'Noto Sans KR', sans-serif; }
</style>
</head>
<body>
<script>
const W = 600, H = 440;
const PAD = { l: 60, r: 16, t: 32, b: 95 };
const PW = W - PAD.l - PAD.r;
const PH = H - PAD.t - PAD.b;

const gX = PAD.l;
const gY = PAD.t;
const gW = PW / 2;
const gH = PH;

const sX = PAD.l + PW / 2 + 16;
const sY = PAD.t;
const sW = PW - gW - 16;
const sH = PH;

let slider_d, slider_lam;

function getLamRGB(lam) {
  let r = 0, g = 0, b = 0;
  if (lam >= 380 && lam < 440) {
    r = -(lam - 440) / (440 - 380); b = 1;
  } else if (lam >= 440 && lam < 490) {
    g = (lam - 440) / (490 - 440); b = 1;
  } else if (lam >= 490 && lam < 510) {
    g = 1; b = -(lam - 510) / (510 - 490);
  } else if (lam >= 510 && lam < 580) {
    r = (lam - 510) / (580 - 510); g = 1;
  } else if (lam >= 580 && lam < 645) {
    r = 1; g = -(lam - 645) / (645 - 580);
  } else if (lam >= 645 && lam <= 700) {
    r = 1;
  }
  let factor = 1;
  if (lam >= 380 && lam < 420) factor = 0.3 + 0.7 * (lam - 380) / (420 - 380);
  else if (lam >= 645 && lam <= 700) factor = 0.3 + 0.7 * (700 - lam) / (700 - 645);
  const gamma = 0.8;
  return {
    r: Math.pow(r * factor, gamma) * 255,
    g: Math.pow(g * factor, gamma) * 255,
    b: Math.pow(b * factor, gamma) * 255
  };
}

function setup() {
  createCanvas(W, H);
  slider_d = createSlider(0.1, 1.0, 0.3, 0.01);
  slider_d.position(PAD.l, H - 55);
  slider_d.style('width', PW + 'px');
  slider_lam = createSlider(380, 700, 550, 5);
  slider_lam.position(PAD.l, H - 25);
  slider_lam.style('width', PW + 'px');
}

function draw() {
  const d = slider_d.value();
  const lam = slider_lam.value();
  const c = getLamRGB(lam);
  background(255);
  drawLeftGraph(d, lam, c);
  drawRightScreen(d, lam, c);
  drawAxes();
  drawLabels(d, lam);
}

function drawLeftGraph(d, lam, c) {
  // 배경 색 띠
  noStroke();
  for (let i = 0; i <= gW; i++) {
    let py = map(i, 0, gW, -10, 10);
    let I = Math.pow(Math.cos(1000 * Math.PI * d * py / lam), 2);
    fill(c.r, c.g, c.b, I * 50);
    rect(gX + i, gY, 1, gH);
  }

  // 그리드
  stroke(220); strokeWeight(0.5);
  for (let v = -10; v <= 10; v += 5) {
    let x = map(v, -10, 10, gX, gX + gW);
    line(x, gY, x, gY + gH);
  }
  for (let I = 0; I <= 1; I += 0.5) {
    let y = map(I, 0, 1, gY + gH, gY);
    line(gX, y, gX + gW, y);
  }

  // 세기 곡선
  noFill();
  stroke(30, 100, 220);
  strokeWeight(2);
  beginShape();
  for (let i = 0; i <= gW; i++) {
    let py = map(i, 0, gW, -10, 10);
    let I = Math.pow(Math.cos(1000 * Math.PI * d * py / lam), 2);
    vertex(gX + i, gY + gH - I * gH);
  }
  endShape();

  // 테두리 4면
  stroke(60); strokeWeight(1.5);
  noFill();
  rect(gX, gY, gW, gH);
}

function drawRightScreen(d, lam, c) {
  for (let i = 0; i <= sW; i++) {
    let py = map(i, 0, sW, -10, 10);
    let I = Math.pow(Math.cos(1000 * Math.PI * d * py / lam), 2);
    stroke(c.r * I, c.g * I, c.b * I);
    line(sX + i, sY, sX + i, sY + sH);
  }

  noFill();
  stroke(60); strokeWeight(1.5);
  rect(sX, sY, sW, sH);

  let cx = sX + sW / 2;
  fill(255, 255, 255, 200);
  noStroke();
  rect(cx - 45, sY - 26, 90, 18, 3);
  fill(0); textSize(11); textAlign(CENTER, CENTER);
  text('중앙 밝은 무늬', cx, sY - 17);
  stroke(0); strokeWeight(1);
  line(cx, sY - 8, cx, sY - 1);
  fill(0); noStroke();
  triangle(cx - 2, sY - 4, cx + 2, sY - 4, cx, sY);
}

function drawAxes() {
  fill(60); noStroke();

  // 왼쪽 X축 눈금
  textSize(12); textAlign(CENTER);
  for (let v = -10; v <= 10; v += 5) {
    let x = map(v, -10, 10, gX, gX + gW);
    text(v, x, gY + gH + 16);
  }
  textSize(13);
  text('스크린 위치 y (mm)', gX + gW / 2, gY + gH + 32);

  // 왼쪽 Y축 눈금
  textSize(11); textAlign(RIGHT, CENTER);
  text('1.0', gX - 6, gY);
  text('0.5', gX - 6, gY + gH / 2);
  text('0',   gX - 6, gY + gH);

  // 왼쪽 Y축 레이블 (캔버스 내 배치)
  push();
  translate(14, gY + gH / 2);
  rotate(-HALF_PI);
  textAlign(CENTER);
  textSize(11);
  text('세기 I', 0, 0);
  pop();

  // 오른쪽 X축 눈금
  textSize(12); textAlign(CENTER);
  for (let v of [-10, 0, 10]) {
    let x = map(v, -10, 10, sX, sX + sW);
    text(v, x, sY + sH + 16);
  }
  textSize(13);
  text('스크린 위치 y (mm)', sX + sW / 2, sY + sH + 32);
}

function drawLabels(d, lam) {
  let boxW = 190;
  let boxH = 80;
  let rx = sX + sW - boxW - 8;
  let ry = sY + 8;

  fill(255, 255, 255, 210);
  noStroke();
  rect(rx, ry, boxW, boxH, 4);

  fill(40);
  textSize(13);
  textAlign(LEFT);
  text('슬릿 간격 d = ' + d.toFixed(2) + ' mm', rx + 10, ry + 22);
  text('파장 λ = ' + lam + ' nm', rx + 10, ry + 44);

  let dy = (lam / d) / 1000;
  fill(30, 100, 220);
  text('무늬 간격 Δy = ' + dy.toFixed(2) + ' mm', rx + 10, ry + 66);

  fill(100);
  textSize(11);
  textAlign(LEFT);
  text('슬릿 간격 d 조절', PAD.l, H - 57);
  text('파장 λ 조절', PAD.l, H - 27);
}
</script>
</body>
</html>
