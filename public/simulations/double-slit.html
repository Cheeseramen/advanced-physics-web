<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #fff; font-family: 'Noto Sans KR', sans-serif; }
</style>
</head>
<body>
<script>
// --- 기본 설정 및 여백 ---
let H = 440;
let PAD = { l: 60, r: 20, t: 42, b: 150 };
let gX, gY, gW, gH;
let sX, sY, sW, sH;

let slider_d, slider_lam, slider_L;

// --- 가시광선 파장(nm) -> RGB 변환 함수 ---
function getLamRGB(lam) {
  let r = 0, g = 0, b = 0;
  if (lam >= 380 && lam < 440) {
    r = -(lam - 440) / (440 - 380); b = 1;
  } else if (lam >= 440 && lam < 490) {
    g = (lam - 440) / (490 - 440); b = 1;
  } else if (lam >= 490 && lam < 510) {
    g = 1; b = -(lam - 510) / (510 - 490);
  } else if (lam >= 510 && lam < 580) {
    r = (lam - 510) / (580 - 510); g = 1;
  } else if (lam >= 580 && lam < 645) {
    r = 1; g = -(lam - 645) / (645 - 580);
  } else if (lam >= 645 && lam <= 700) {
    r = 1;
  }

  let factor = 1;
  if (lam >= 380 && lam < 420) factor = 0.3 + 0.7 * (lam - 380) / (420 - 380);
  else if (lam >= 645 && lam <= 700) factor = 0.3 + 0.7 * (700 - lam) / (700 - 645);

  const gamma = 0.8;
  return {
    r: Math.pow(r * factor, gamma) * 255,
    g: Math.pow(g * factor, gamma) * 255,
    b: Math.pow(b * factor, gamma) * 255
  };
}

function setup() {
  // 반응형 너비 적용
  createCanvas(windowWidth, H);

  // 슬라이더 1: 슬릿 간격 d (mm)
  slider_d = createSlider(0.1, 1.0, 0.3, 0.01);

  // 슬라이더 2: 파장 λ (nm)
  slider_lam = createSlider(380, 700, 550, 5);

  // 슬라이더 3: 스크린 거리 L (m)
  slider_L = createSlider(0.5, 2.0, 1.0, 0.1);

  calculateLayout();
}

function windowResized() {
  resizeCanvas(windowWidth, H);
  calculateLayout();
}

// 창 크기에 맞게 레이아웃 동적 계산 (반응형)
function calculateLayout() {
  let PW = width - PAD.l - PAD.r;
  let gap = 30; // 좌우 패널 간격

  gW = (PW - gap) / 2;
  sW = gW;
  gH = H - PAD.t - PAD.b;
  sH = gH;

  gX = PAD.l;
  gY = PAD.t;
  sX = gX + gW + gap;
  sY = PAD.t;

  // 슬라이더 너비 및 위치 반응형 정렬
  let labelW = 100;
  let sliderW = Math.min(PW - labelW, 600); // 슬라이더 최대 너비 제한

  slider_d.position(PAD.l + labelW, H - 105);
  slider_d.style('width', sliderW + 'px');

  slider_lam.position(PAD.l + labelW, H - 70);
  slider_lam.style('width', sliderW + 'px');

  slider_L.position(PAD.l + labelW, H - 35);
  slider_L.style('width', sliderW + 'px');
}

function draw() {
  const d = slider_d.value();
  const lam = slider_lam.value();
  const L = slider_L.value();
  const c = getLamRGB(lam);

  background(255);

  drawLeftGraph(d, lam, L, c);
  drawRightScreen(d, lam, L, c);
  drawAxes();
  drawLabels(d, lam, L);
  handleHover(d, lam, L);
}

// 1. 왼쪽 세기 분포 그래프
function drawLeftGraph(d, lam, L, c) {
  noStroke();
  for (let i = 0; i <= gW; i++) {
    let py = map(i, 0, gW, -10, 10);
    let I = Math.pow(Math.cos(1000 * Math.PI * d * py / (lam * L)), 2);
    fill(c.r, c.g, c.b, I * 50);
    rect(gX + i, gY, 1, gH);
  }

  // 그리드 라인
  stroke(220); strokeWeight(0.5);
  for (let v = -10; v <= 10; v += 5) {
    let x = map(v, -10, 10, gX, gX + gW);
    line(x, gY, x, gY + gH);
  }
  for (let I = 0; I <= 1; I += 0.5) {
    let y = map(I, 0, 1, gY + gH, gY);
    line(gX, y, gX + gW, y);
  }

  // 파란색 곡선
  noFill();
  stroke(30, 100, 220);
  strokeWeight(2);
  beginShape();
  for (let i = 0; i <= gW; i++) {
    let py = map(i, 0, gW, -10, 10);
    let I = Math.pow(Math.cos(1000 * Math.PI * d * py / (lam * L)), 2);
    vertex(gX + i, gY + gH - I * gH);
  }
  endShape();

  // 테두리
  stroke(60); strokeWeight(1.5);
  line(gX, gY, gX, gY + gH);
  line(gX, gY + gH, gX + gW, gY + gH);
}

// 2. 오른쪽 스크린 시각화 영역
function drawRightScreen(d, lam, L, c) {
  for (let i = 0; i <= sW; i++) {
    let py = map(i, 0, sW, -10, 10);
    let I = Math.pow(Math.cos(1000 * Math.PI * d * py / (lam * L)), 2);
    stroke(c.r * I, c.g * I, c.b * I);
    line(sX + i, sY, sX + i, sY + sH);
  }

  noFill();
  stroke(60); strokeWeight(1.5);
  rect(sX, sY, sW, sH);

  // 중앙(y=0) 밝은 무늬 표시기
  let cx = sX + sW / 2;
  fill(255, 255, 255, 200);
  noStroke();
  rect(cx - 45, sY - 26, 90, 18, 3);

  fill(0); textSize(11); textAlign(CENTER, CENTER);
  text("중앙 밝은 무늬", cx, sY - 17);

  stroke(0); strokeWeight(1);
  line(cx, sY - 8, cx, sY - 1);
  fill(0); noStroke();
  triangle(cx - 2, sY - 4, cx + 2, sY - 4, cx, sY);
}

// 3. 축 레이블 그리기
function drawAxes() {
  fill(60); noStroke();

  // 왼쪽 그래프 X축
  textSize(12); textAlign(CENTER);
  for (let v = -10; v <= 10; v += 5) {
    let x = map(v, -10, 10, gX, gX + gW);
    text(v, x, gY + gH + 16);
  }
  textSize(13);
  text("스크린 위치 y (mm)", gX + gW / 2, gY + gH + 32);

  // 왼쪽 그래프 Y축
  textSize(12); textAlign(RIGHT, CENTER);
  text("1.0", gX - 8, gY);
  text("0.5", gX - 8, gY + gH / 2);
  text("0", gX - 8, gY + gH);

  push();
  translate(gX - 35, gY + gH / 2);
  rotate(-HALF_PI);
  textAlign(CENTER);
  textSize(13);
  text("상대 세기 I", 0, 0);
  pop();

  // 오른쪽 스크린 축
  textSize(12); textAlign(CENTER, BOTTOM);
  for (let v of [-10, 0, 10]) {
    let x = map(v, -10, 10, sX, sX + sW);
    text(v, x, sY + sH + 16);
  }
  textSize(13);
  text("스크린 위치 y (mm)", sX + sW / 2, sY + sH + 32);
}

// 4. 정보 패널 및 슬라이더 텍스트
function drawLabels(d, lam, L) {
  // 우상단 정보 패널
  let boxW = 200;
  let boxH = 96;
  let rx = sX + sW - boxW - 8;
  let ry = sY + 8;

  // 화면이 좁을 경우 패널이 화면 밖으로 나가지 않도록 방지
  if (rx < PAD.l) rx = PAD.l + 8;

  fill(255, 255, 255, 220);
  stroke(200); strokeWeight(1);
  rect(rx, ry, boxW, boxH, 4);

  fill(40); noStroke();
  textSize(13);
  textAlign(LEFT);
  text(`슬릿 간격 d = ${d.toFixed(2)} mm`, rx + 14, ry + 22);
  text(`빛의 파장 λ = ${lam} nm`, rx + 14, ry + 42);
  text(`스크린 거리 L = ${L.toFixed(1)} m`, rx + 14, ry + 62);

  // 무늬 간격(Δy) 계산: λL / d
  fill(30, 100, 220); // 파란색 강조
  let dy = (lam * L / d) / 1000;
  text(`무늬 간격 Δy = ${dy.toFixed(2)} mm`, rx + 14, ry + 82);

  // 하단 슬라이더 레이블
  fill(80);
  textSize(12);
  textAlign(LEFT, CENTER);
  text("슬릿 간격 (d)", PAD.l, H - 95);
  text("빛의 파장 (λ)", PAD.l, H - 60);
  text("스크린 거리 (L)", PAD.l, H - 25);
}

// 5. 호버 툴팁 인터랙션
function handleHover(d, lam, L) {
  let isGraph = (mouseX >= gX && mouseX <= gX + gW && mouseY >= gY && mouseY <= gY + gH);
  let isScreen = (mouseX >= sX && mouseX <= sX + sW && mouseY >= sY && mouseY <= sY + sH);

  if (isGraph || isScreen) {
    let areaX = isGraph ? gX : sX;
    let areaW = isGraph ? gW : sW;

    // 마우스 X 좌표를 스크린 y 위치(-10 ~ 10mm)로 변환
    let py = map(mouseX, areaX, areaX + areaW, -10, 10);
    // 해당 위치의 상대 세기(I) 계산
    let I = Math.pow(Math.cos(1000 * Math.PI * d * py / (lam * L)), 2);

    // 십자선 (세로 점선)
    drawingContext.setLineDash([4, 4]);
    stroke(120); strokeWeight(1.5);
    if (isGraph) {
      line(mouseX, gY, mouseX, gY + gH);
    } else if (isScreen) {
      line(mouseX, sY, mouseX, sY + sH);
    }
    drawingContext.setLineDash([]);

    // 그래프 영역일 경우 파동 곡선 위에 마커 표시
    if (isGraph) {
      let pyGraph = map(I, 0, 1, gY + gH, gY);
      fill(30, 100, 220);
      noStroke();
      ellipse(mouseX, pyGraph, 8, 8);
    }

    // 툴팁 박스 렌더링
    let ttW = 140;
    let ttH = 46;
    let ttX = mouseX - ttW / 2;
    let ttY = mouseY - ttH - 15;

    // 화면 밖으로 벗어나지 않도록 보정
    if (ttX < 10) ttX = 10;
    if (ttX + ttW > width - 10) ttX = width - ttW - 10;
    if (ttY < 10) ttY = mouseY + 15;

    fill(255, 255, 255, 240);
    stroke(200); strokeWeight(1);
    rect(ttX, ttY, ttW, ttH, 4);

    fill(40); noStroke();
    textAlign(CENTER, CENTER);
    textSize(11);
    text(`위치 y = ${py.toFixed(2)} mm\n상대 세기 I = ${I.toFixed(2)}`, ttX + ttW / 2, ttY + ttH / 2);
  }
}
</script>
</body>
</html>
