<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #fff; font-family: 'Noto Sans KR', sans-serif; }
</style>
</head>
<body>
<script>
// --- 상태 변수 ---
let isPlaying = true;
let isSuper = false;
let time = 0;
let current_n = 1;

// --- 레이아웃 변수 ---
let PAD = { l: 60, r: 20, t: 40, b: 100 };
let gX, gY, gW, gH;
let sX, sY, sW, sH;

// --- UI 요소 ---
let nBtns = [];
let superBtn;
let playBtn;

// --- 색상 팔레트 (라이트 고정) ---
const C = {
  bg:        '#ffffff',
  text:      '#1a1a1a',
  textMuted: '#888888',
  grid:      '#e2e2e2',
  wall:      '#333333',
  wave:      [26, 90, 180],       // 파동함수: 파랑
  waveFill:  [26, 90, 180, 35],
  prob:      [121, 18, 21],       // 확률밀도: boinred
  probFill:  [121, 18, 21, 40],
  panelBox:  '#cccccc',
  tooltipBg: [255, 255, 255, 230],
  active:    '#791215',           // 활성 버튼: boinred
};

function setup() {
  createCanvas(windowWidth, windowHeight);

  for (let i = 1; i <= 5; i++) {
    let btn = createButton('n = ' + i);
    btn.mousePressed(() => { isSuper = false; current_n = i; updateUIStyles(); });
    nBtns.push(btn);
  }

  superBtn = createButton('상태 중첩 (n=1 & 2)');
  superBtn.mousePressed(() => { isSuper = true; updateUIStyles(); });

  playBtn = createButton('⏸ 일시정지');
  playBtn.mousePressed(() => {
    isPlaying = !isPlaying;
    playBtn.html(isPlaying ? '⏸ 일시정지' : '▶ 재생');
    updateUIStyles();
  });

  [...nBtns, superBtn, playBtn].forEach(btn => {
    btn.style('font-family', "'Noto Sans KR', sans-serif");
    btn.style('font-size', '12px');
    btn.style('cursor', 'pointer');
    btn.style('border-radius', '4px');
    btn.style('padding', '4px 8px');
  });

  calculateLayout();
  updateUIStyles();
}

function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  calculateLayout();
}

function calculateLayout() {
  let W = width;
  let H = height;

  PAD.l = Math.max(50, W * 0.08);
  PAD.r = Math.max(20, W * 0.04);
  PAD.t = Math.max(30, H * 0.08);
  PAD.b = 90;

  let PW = W - PAD.l - PAD.r;
  let PH = H - PAD.t - PAD.b;
  let gap = 30;

  gW = (PW - gap) / 2;
  sW = gW;
  gH = PH;
  sH = PH;
  gX = PAD.l;
  gY = PAD.t;
  sX = gX + gW + gap;
  sY = PAD.t;

  let btnY = height - 40;

  for (let i = 0; i < 5; i++) {
    nBtns[i].position(PAD.l + i * 55, btnY);
    nBtns[i].size(50, 26);
  }
  superBtn.position(PAD.l + 5 * 55 + 8, btnY);
  superBtn.size(130, 26);
  playBtn.position(PAD.l + 5 * 55 + 8 + 138, btnY);
  playBtn.size(90, 26);
}

function updateUIStyles() {
  for (let i = 0; i < 5; i++) {
    if (!isSuper && current_n === i + 1) {
      nBtns[i].style('background', C.active);
      nBtns[i].style('color', '#ffffff');
      nBtns[i].style('border', '1px solid ' + C.active);
    } else {
      nBtns[i].style('background', '#ffffff');
      nBtns[i].style('color', '#333333');
      nBtns[i].style('border', '1px solid #cccccc');
    }
  }

  if (isSuper) {
    superBtn.style('background', C.active);
    superBtn.style('color', '#ffffff');
    superBtn.style('border', '1px solid ' + C.active);
  } else {
    superBtn.style('background', '#ffffff');
    superBtn.style('color', '#333333');
    superBtn.style('border', '1px solid #cccccc');
  }

  playBtn.style('background', '#ffffff');
  playBtn.style('color', '#333333');
  playBtn.style('border', '1px solid #cccccc');
}

function draw() {
  if (isPlaying) time += 0.05;

  background(255);
  drawLeftPanel();
  drawRightPanel();
  drawAxes();
  drawInfoBox();
  handleHover();
}

function drawLeftPanel() {
  stroke(C.panelBox);
  strokeWeight(1.5);
  noFill();
  rect(gX, gY, gW, gH);

  stroke(C.wall);
  strokeWeight(4);
  line(gX, gY, gX, gY + gH);
  line(gX + gW, gY, gX + gW, gY + gH);

  for (let n = 1; n <= 5; n++) {
    let E = n * n;
    let yE = map(E, -2, 28, gY + gH, gY);

    drawingContext.setLineDash([4, 4]);
    stroke(C.grid);
    strokeWeight(1);
    line(gX, yE, gX + gW, yE);
    drawingContext.setLineDash([]);

    fill(C.textMuted);
    noStroke();
    textAlign(RIGHT, CENTER);
    textSize(10);
    text(`E${n}`, gX - 4, yE);
  }

  let amp = 2.0;
  if (isSuper) {
    drawWave(1, time, 1 / Math.sqrt(2), amp);
    drawWave(2, time, 1 / Math.sqrt(2), amp);
  } else {
    drawWave(current_n, time, 1, amp);
  }

  fill(C.text);
  noStroke();
  textSize(13);
  textAlign(CENTER);
  text("파동함수 Re[ψₙ(x,t)]", gX + gW / 2, gY - 12);
}

function drawWave(n, t, coeff, amp) {
  let E = n * n;
  let yBaseline = map(E, -2, 28, gY + gH, gY);

  fill(...C.waveFill);
  noStroke();
  beginShape();
  vertex(gX, yBaseline);
  for (let i = 0; i <= gW; i++) {
    let x_phys = map(i, 0, gW, 0, 1);
    let re_psi = coeff * Math.sin(n * Math.PI * x_phys) * Math.cos(E * t);
    let y = map(E + amp * re_psi, -2, 28, gY + gH, gY);
    vertex(gX + i, y);
  }
  vertex(gX + gW, yBaseline);
  endShape(CLOSE);

  noFill();
  stroke(...C.wave);
  strokeWeight(2.0);
  beginShape();
  for (let i = 0; i <= gW; i++) {
    let x_phys = map(i, 0, gW, 0, 1);
    let re_psi = coeff * Math.sin(n * Math.PI * x_phys) * Math.cos(E * t);
    let y = map(E + amp * re_psi, -2, 28, gY + gH, gY);
    vertex(gX + i, y);
  }
  endShape();
}

function drawRightPanel() {
  stroke(C.panelBox);
  strokeWeight(1.5);
  noFill();
  rect(sX, sY, sW, sH);

  stroke(C.wall);
  strokeWeight(4);
  line(sX, sY, sX, sY + sH);
  line(sX + sW, sY, sX + sW, sY + sH);

  let y0 = map(0, 0, 2.0, sY + sH, sY);

  fill(...C.probFill);
  noStroke();
  beginShape();
  vertex(sX, y0);
  for (let i = 0; i <= sW; i++) {
    let x_phys = map(i, 0, sW, 0, 1);
    let prob = calculateProbability(x_phys);
    let y = map(prob, 0, 2.0, sY + sH, sY);
    vertex(sX + i, y);
  }
  vertex(sX + sW, y0);
  endShape(CLOSE);

  noFill();
  stroke(...C.prob);
  strokeWeight(2.5);
  beginShape();
  for (let i = 0; i <= sW; i++) {
    let x_phys = map(i, 0, sW, 0, 1);
    let prob = calculateProbability(x_phys);
    let y = map(prob, 0, 2.0, sY + sH, sY);
    vertex(sX + i, y);
  }
  endShape();

  fill(C.text);
  noStroke();
  textSize(13);
  textAlign(CENTER);
  text("확률밀도 |Ψ(x,t)|²", sX + sW / 2, sY - 12);
}

function calculateProbability(x_phys) {
  if (isSuper) {
    let term1 = 0.5 * Math.pow(Math.sin(Math.PI * x_phys), 2);
    let term2 = 0.5 * Math.pow(Math.sin(2 * Math.PI * x_phys), 2);
    let cross = Math.sin(Math.PI * x_phys) * Math.sin(2 * Math.PI * x_phys) * Math.cos(3 * time);
    return term1 + term2 + cross;
  } else {
    return Math.pow(Math.sin(current_n * Math.PI * x_phys), 2);
  }
}

function drawAxes() {
  fill(C.textMuted);
  noStroke();

  textSize(12);
  textAlign(CENTER);
  text("0",   gX,         gY + gH + 18);
  text("L/2", gX + gW/2,  gY + gH + 18);
  text("L",   gX + gW,    gY + gH + 18);

  push();
  translate(gX - 32, gY + gH / 2);
  rotate(-HALF_PI);
  textAlign(CENTER);
  textSize(12);
  text("에너지 (E)", 0, 0);
  pop();

  textAlign(CENTER);
  text("0",   sX,         sY + sH + 18);
  text("L/2", sX + sW/2,  sY + sH + 18);
  text("L",   sX + sW,    sY + sH + 18);

  fill(C.text);
  textSize(13);
  text("상자 안의 위치 x", width / 2, gY + gH + 36);

  fill(C.textMuted);
  textSize(11);
  textAlign(RIGHT, CENTER);
  text("2.0", sX - 6, map(2.0, 0, 2.0, sY + sH, sY));
  text("1.0", sX - 6, map(1.0, 0, 2.0, sY + sH, sY));
  text("0",   sX - 6, map(0,   0, 2.0, sY + sH, sY));
}

function drawInfoBox() {
  let boxW = 160;
  let rx = sX + sW - boxW - 12;
  let ry = sY + 12;

  fill(...C.tooltipBg);
  stroke(C.panelBox);
  strokeWeight(1);
  rect(rx, ry, boxW, 64, 6);

  fill(C.text);
  noStroke();
  textSize(13);
  textAlign(LEFT);

  if (isSuper) {
    text("상태: (ψ₁ + ψ₂) / √2",    rx + 14, ry + 24);
    text("기대 에너지 <E> = 2.5 E₁", rx + 14, ry + 46);
  } else {
    text(`상태: 양자수 n = ${current_n}`,       rx + 14, ry + 24);
    text(`에너지 E = ${current_n * current_n} E₁`, rx + 14, ry + 46);
  }
}

function handleHover() {
  if (mouseX >= sX && mouseX <= sX + sW && mouseY >= sY && mouseY <= sY + sH) {
    let x_phys = map(mouseX, sX, sX + sW, 0, 1);
    let prob = calculateProbability(x_phys);

    drawingContext.setLineDash([3, 3]);
    stroke(C.textMuted);
    strokeWeight(1);
    line(mouseX, sY, mouseX, sY + sH);
    drawingContext.setLineDash([]);

    let yPoint = map(prob, 0, 2.0, sY + sH, sY);
    fill(...C.prob);
    noStroke();
    ellipse(mouseX, yPoint, 8, 8);

    let ttW = 110;
    let ttH = 46;
    let ttX = mouseX - ttW / 2;
    let ttY = mouseY - ttH - 15;

    if (ttX < sX) ttX = sX;
    if (ttX + ttW > sX + sW) ttX = sX + sW - ttW;
    if (ttY < sY) ttY = mouseY + 15;

    fill(...C.tooltipBg);
    stroke(C.panelBox);
    strokeWeight(1);
    rect(ttX, ttY, ttW, ttH, 4);

    fill(C.text);
    noStroke();
    textAlign(CENTER, CENTER);
    textSize(11);
    text(`위치 x = ${x_phys.toFixed(2)} L\n확률밀도 = ${prob.toFixed(2)}`, ttX + ttW/2, ttY + ttH/2);
  }
}
</script>
</body>
</html>
