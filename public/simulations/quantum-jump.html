<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #fff; font-family: 'Noto Sans KR', sans-serif; }
</style>
</head>
<body>
<script>
const W = 600, H = 440;

// boinred: rgb(121, 18, 21)
const BR  = [121, 18, 21];
const BRL = [121, 18, 21, 40];  // 연한 boinred (글로우)
const BRM = [121, 18, 21, 100]; // 중간 boinred

let gameState = 'START';

const levels = [
  { n: 1, E: 1,  y: 380 },
  { n: 2, E: 4,  y: 285 },
  { n: 3, E: 9,  y: 190 },
  { n: 4, E: 16, y: 95  }
];

let electron = { n: 1, x: W / 2, y: 380, targetY: 380 };
let photons = [];
let floatingTexts = [];
let frameCounter = 0;

function setup() {
  createCanvas(W, H);
  textAlign(CENTER, CENTER);
}

function draw() {
  if      (gameState === 'START') drawStartScreen();
  else if (gameState === 'PLAY')  drawGame();
  else if (gameState === 'WIN')   drawWinScreen();
}

// --- 게임 주화면 ---
function drawGame() {
  // 밝은 잔상 배경
  background(255, 252, 252, 220);
  drawEnergyLevels();
  handlePlayerInput();
  updateAndDrawElectron();
  handlePhotons();
  drawFloatingTexts();
  drawUI();
}

function drawEnergyLevels() {
  strokeWeight(2);
  for (let lvl of levels) {
    if (lvl.n === electron.n) {
      stroke(...BR, 200);
      drawingContext.setLineDash([]);
    } else {
      stroke(180, 180, 185, 160);
      drawingContext.setLineDash([8, 8]);
    }
    line(50, lvl.y, W - 50, lvl.y);

    noStroke();
    fill(lvl.n === electron.n ? color(...BR) : color(120));
    textSize(11);
    textAlign(LEFT, CENTER);
    text(`n = ${lvl.n}`, 12, lvl.y);
    textAlign(RIGHT, CENTER);
    text(`E = ${lvl.E} E₁`, W - 8, lvl.y);
  }
  drawingContext.setLineDash([]);
}

function handlePlayerInput() {
  const speed = 6;
  if (keyIsDown(LEFT_ARROW)  || keyIsDown(65)) electron.x -= speed;
  if (keyIsDown(RIGHT_ARROW) || keyIsDown(68)) electron.x += speed;
  electron.x = constrain(electron.x, 60, W - 60);
}

function updateAndDrawElectron() {
  electron.y = lerp(electron.y, electron.targetY, 0.2);

  noStroke();
  // 글로우
  fill(...BR, 25 + sin(frameCount * 0.1) * 15);
  ellipse(electron.x, electron.y, 44, 44);
  fill(...BR, 70);
  ellipse(electron.x, electron.y, 26, 26);
  // 코어
  fill(...BR);
  ellipse(electron.x, electron.y, 10, 10);
  // 흰 중심점
  fill(255);
  ellipse(electron.x, electron.y, 4, 4);
}

function handlePhotons() {
  frameCounter++;
  if (frameCounter % 50 === 0) spawnPhoton();

  for (let i = photons.length - 1; i >= 0; i--) {
    let p = photons[i];
    p.y += p.speed;

    noStroke();
    if (p.ghost) {
      fill(200, 100, 100, 60);
    } else {
      fill(210, 120, 20, 220); // 진한 amber
    }
    ellipse(p.x, p.y, 38, 38);

    fill(p.ghost ? color(160, 40, 40, 160) : color(40));
    textAlign(CENTER, CENTER);
    textStyle(BOLD);
    textSize(13);
    text(`+${p.energy}`, p.x, p.y);
    textStyle(NORMAL);

    if (!p.ghost && dist(electron.x, electron.y, p.x, p.y) < 25) {
      checkQuantumJump(p);
    }
    if (p.y > H + 20) photons.splice(i, 1);
  }
}

function spawnPhoton() {
  let requiredE = [];
  let currentE = electron.n * electron.n;
  for (let lvl of levels) {
    if (lvl.n > electron.n) requiredE.push(lvl.E - currentE);
  }

  let spawnEnergy;
  if (random(1) < 0.5 && requiredE.length > 0) {
    spawnEnergy = random(requiredE);
  } else {
    let base = requiredE.length > 0 ? random(requiredE) : 3;
    spawnEnergy = base + floor(random(-2, 3));
    if (spawnEnergy <= 0) spawnEnergy = 1;
  }
  photons.push({ x: random(80, W - 80), y: -20, energy: spawnEnergy, speed: random(3, 5), ghost: false });
}

function checkQuantumJump(photon) {
  let currentE = electron.n * electron.n;
  let nextE = currentE + photon.energy;
  let targetLevel = levels.find(l => l.E === nextE);

  if (targetLevel) {
    electron.n = targetLevel.n;
    electron.targetY = targetLevel.y;
    addFloatingText("양자 도약!", electron.x, electron.y - 30, [...BR]);
    photons.splice(photons.indexOf(photon), 1);
    if (electron.n === 4) setTimeout(() => { gameState = 'WIN'; }, 500);
  } else {
    photon.ghost = true;
    addFloatingText("투과됨 (에너지 불일치)", electron.x, electron.y - 30, [180, 60, 60]);
  }
}

function addFloatingText(msg, x, y, col) {
  floatingTexts.push({ msg, x, y, life: 60, col });
}

function drawFloatingTexts() {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let ft = floatingTexts[i];
    fill(ft.col[0], ft.col[1], ft.col[2], map(ft.life, 0, 60, 0, 255));
    textAlign(CENTER, CENTER);
    textSize(13);
    text(ft.msg, ft.x, ft.y);
    ft.y -= 1;
    ft.life -= 1;
    if (ft.life <= 0) floatingTexts.splice(i, 1);
  }
}

function drawUI() {
  fill(100);
  textSize(12);
  textAlign(LEFT, TOP);
  text("조작: ← / → 방향키", 20, 18);
  textAlign(RIGHT, TOP);
  fill(...BR);
  text("목표: n = 4 상태로 들뜨기", W - 20, 18);
}

// --- 시작 화면 ---
function drawStartScreen() {
  background(255);

  fill(...BR);
  textSize(22);
  textAlign(CENTER, CENTER);
  text("양자 도약 (Quantum Jump)", W / 2, H / 2 - 75);

  // 구분선
  stroke(...BR, 80);
  strokeWeight(1);
  line(W / 2 - 120, H / 2 - 55, W / 2 + 120, H / 2 - 55);
  noStroke();

  fill(60);
  textSize(13);
  text("전자는 특정한 에너지 준위에만 존재할 수 있습니다.", W / 2, H / 2 - 28);
  text("위층으로 올라가려면, 두 준위의 에너지 차이(ΔE)와", W / 2, H / 2 - 5);
  fill(...BR);
  text("정확히 일치하는 광자만 흡수할 수 있습니다.", W / 2, H / 2 + 20);

  // 시작 버튼
  fill(...BR, 15);
  stroke(...BR, 60);
  strokeWeight(1);
  rect(W / 2 - 80, H / 2 + 65, 160, 34, 6);
  noStroke();
  fill(...BR);
  textSize(13);
  text("아무 키나 눌러서 시작", W / 2, H / 2 + 82);

  if (keyIsPressed) gameState = 'PLAY';
}

// --- 승리 화면 ---
function drawWinScreen() {
  background(252, 237, 237); // boxbg

  fill(...BR);
  textSize(26);
  textAlign(CENTER, CENTER);
  text("탈출 성공!", W / 2, H / 2 - 55);

  stroke(...BR, 80);
  strokeWeight(1);
  line(W / 2 - 100, H / 2 - 35, W / 2 + 100, H / 2 - 35);
  noStroke();

  fill(60);
  textSize(13);
  text("정확한 에너지만 흡수하는 양자화의 성질을 체험했습니다.", W / 2, H / 2);

  fill(130);
  textSize(12);
  text("다시 플레이하려면 화면을 클릭하세요.", W / 2, H / 2 + 65);
}

function keyPressed() {
  if (keyCode === ESCAPE) {
    window.parent.postMessage('close-quantum-jump', '*')
  }
}

function mousePressed() {
  if (gameState === 'WIN' || gameState === 'START') {
    electron = { n: 1, x: W / 2, y: 380, targetY: 380 };
    photons = [];
    floatingTexts = [];
    frameCounter = 0;
    gameState = 'PLAY';
  }
}
</script>
</body>
</html>
