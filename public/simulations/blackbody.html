<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
<style>
  body { margin: 0; overflow: hidden; background: #fff; font-family: 'Noto Sans KR', sans-serif; }
</style>
</head>
<body>
<script>
const W = 480, H = 320;
const PAD = { l: 52, r: 16, t: 32, b: 52 };
const PW = W - PAD.l - PAD.r;
const PH = H - PAD.t - PAD.b;

// 물리 상수
const h = 6.626e-34;
const c = 3e8;
const k = 1.381e-23;
const b_wien = 2.898e-3;

// 파장 범위: 100~3000 nm
const LAM_MIN = 100e-9;
const LAM_MAX = 3000e-9;

let slider;

function planck(lam, T) {
  const exp = (h * c) / (lam * k * T);
  if (exp > 700) return 0;
  return (2 * h * c * c) / (Math.pow(lam, 5) * (Math.exp(exp) - 1));
}

function rayleighJeans(lam, T) {
  return (2 * c * k * T) / Math.pow(lam, 4);
}

function lamToX(lam) {
  return PAD.l + (lam - LAM_MIN) / (LAM_MAX - LAM_MIN) * PW;
}

function valToY(val, maxB) {
  return PAD.t + PH - Math.min(val / (maxB * 1.15), 1.05) * PH;
}

function setup() {
  createCanvas(W, H);
  slider = createSlider(1000, 10000, 5778, 100);
  slider.position(PAD.l, H - 20);
  slider.style('width', PW + 'px');
}

function draw() {
  const T = slider.value();
  background(255);

  // 플랑크 최대값 계산
  let maxB = 0;
  for (let i = 0; i <= 600; i++) {
    const lam = LAM_MIN + (LAM_MAX - LAM_MIN) * i / 600;
    const v = planck(lam, T);
    if (v > maxB) maxB = v;
  }

  drawSpectrumBand();
  drawGrid(maxB);
  drawRJ(T, maxB);
  drawPlanckCurve(T, maxB);
  drawPeak(T, maxB);
  drawAxes();
  drawLabels(T);
}

function drawSpectrumBand() {
  // 가시광선 영역 (380~700nm) 배경
  const bands = [
    [380e-9, 430e-9, [148, 0, 211, 40]],
    [430e-9, 480e-9, [0,   0, 255, 40]],
    [480e-9, 520e-9, [0, 180, 255, 40]],
    [520e-9, 560e-9, [0, 200,   0, 40]],
    [560e-9, 600e-9, [255, 220, 0, 40]],
    [600e-9, 650e-9, [255, 140, 0, 40]],
    [650e-9, 700e-9, [220,   0, 0, 40]],
  ];
  noStroke();
  for (const [l1, l2, col] of bands) {
    fill(col[0], col[1], col[2], col[3]);
    rect(lamToX(l1), PAD.t, lamToX(l2) - lamToX(l1), PH);
  }
  // 가시광선 레이블
  fill(120);
  textSize(9);
  textAlign(CENTER);
  text('가시광선', lamToX(540e-9), PAD.t + 11);
}

function drawGrid(maxB) {
  stroke(220);
  strokeWeight(0.5);
  // 수직 격자
  for (let lam = 500e-9; lam <= LAM_MAX; lam += 500e-9) {
    const x = lamToX(lam);
    line(x, PAD.t, x, PAD.t + PH);
  }
  // 수평 격자
  for (let r = 0.25; r <= 1.0; r += 0.25) {
    const y = PAD.t + PH - r * PH;
    line(PAD.l, y, PAD.l + PW, y);
  }
}

function drawRJ(T, maxB) {
  stroke(210, 70, 70);
  strokeWeight(1.8);
  noFill();
  beginShape();
  let started = false;
  for (let i = 0; i <= 600; i++) {
    const lam = LAM_MIN + (LAM_MAX - LAM_MIN) * i / 600;
    const val = rayleighJeans(lam, T);
    const x = lamToX(lam);
    const y = valToY(val, maxB);
    if (y >= PAD.t - 2) {
      if (!started) { started = true; }
      vertex(x, Math.max(y, PAD.t - 2));
    } else {
      if (started) { endShape(); beginShape(); started = false; }
    }
  }
  endShape();
}

function drawPlanckCurve(T, maxB) {
  stroke(50, 100, 200);
  strokeWeight(2.5);
  noFill();
  beginShape();
  for (let i = 0; i <= 600; i++) {
    const lam = LAM_MIN + (LAM_MAX - LAM_MIN) * i / 600;
    const val = planck(lam, T);
    const x = lamToX(lam);
    const y = valToY(val, maxB);
    vertex(x, y);
  }
  endShape();
}

function drawPeak(T, maxB) {
  const lamPeak = b_wien / T;
  if (lamPeak < LAM_MIN || lamPeak > LAM_MAX) return;
  const x = lamToX(lamPeak);
  const yPeak = valToY(planck(lamPeak, T), maxB);

  // 점선
  drawingContext.setLineDash([4, 3]);
  stroke(50, 160, 80);
  strokeWeight(1.2);
  line(x, PAD.t + PH, x, yPeak + 4);
  drawingContext.setLineDash([]);

  // 꼭짓점 마크
  fill(50, 160, 80);
  noStroke();
  ellipse(x, yPeak, 7, 7);

  // 피크 파장 레이블
  textSize(9.5);
  textAlign(CENTER);
  fill(50, 140, 70);
  text('λ_max = ' + (lamPeak * 1e9).toFixed(0) + ' nm', x, yPeak - 9);
}

function drawAxes() {
  stroke(60);
  strokeWeight(1.5);
  line(PAD.l, PAD.t, PAD.l, PAD.t + PH);
  line(PAD.l, PAD.t + PH, PAD.l + PW, PAD.t + PH);

  // X 눈금
  fill(60);
  noStroke();
  textSize(10);
  textAlign(CENTER);
  for (let lam = 500e-9; lam <= LAM_MAX; lam += 500e-9) {
    text((lam * 1e9).toFixed(0), lamToX(lam), PAD.t + PH + 13);
  }

  // 축 이름
  textSize(11);
  text('파장 λ (nm)', PAD.l + PW / 2, PAD.t + PH + 26);

  push();
  translate(13, PAD.t + PH / 2);
  rotate(-HALF_PI);
  textSize(10);
  textAlign(CENTER);
  text('분광 복사율', 0, 0);
  pop();
}

function drawLabels(T) {
  // 온도 표시
  noStroke();
  fill(40);
  textSize(13);
  textAlign(RIGHT);
  text('T = ' + T + ' K', PAD.l + PW, PAD.t + 16);

  // 범례
  textSize(10);
  textAlign(LEFT);

  fill(50, 100, 200);
  rect(PAD.l + 4, PAD.t + 4, 14, 3);
  fill(50);
  text('플랑크 법칙', PAD.l + 22, PAD.t + 16);

  fill(210, 70, 70);
  rect(PAD.l + 4, PAD.t + 18, 14, 3);
  fill(50);
  text('레일리-진스 (자외선 파탄)', PAD.l + 22, PAD.t + 30);

  // 슬라이더 레이블
  fill(120);
  textSize(9.5);
  textAlign(LEFT);
  text('온도 조절', PAD.l, H - 23);
}
</script>
</body>
</html>
